name: C/C++ CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-slim
    container: devkitpro/devkitarm:20251231

    steps:
    - uses: actions/checkout@v5
    - name: make all
      run: make all
    - name: Upload binary
      uses: actions/upload-artifact@v6
      with:
        name: Build
        path: |
          TJAP_3DS.3dsx
          TJAP_3DS.elf
          TJAP_3DS.cia
